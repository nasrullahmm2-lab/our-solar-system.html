<html>
<head>
    <title>Interactive Solar System</title>
    
    <!-- WRITE YOUR CSS HERE INSIDE THE HEAD -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #020208;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }
        .space {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .sun {
            width: 80px;
            height: 80px;
            background: #ffaa00;
            border-radius: 50%;
            box-shadow: 0 0 50px #ff6600;
            z-index: 10;
        }
        .orbit {
            position: absolute;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: spin linear infinite;
        }
        .planet {
            position: absolute;
            border-radius: 50%;
        }
        .earth-orbit { width: 250px; height: 250px; animation-duration: 12s; }
        .earth { width: 24px; height: 24px; background: #2b82c9; top: -12px; }
        
        .mars-orbit { width: 400px; height: 400px; animation-duration: 20s; }
        .mars { width: 18px; height: 18px; background: #c1440e; top: -9px; }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .info-panel {
            position: fixed;
            right: -350px;
            top: 20px;
            width: 300px;
            background: rgba(15, 15, 30, 0.9);
            padding: 25px;
            border-radius: 12px;
            transition: right 0.4s;
            z-index: 100;
        }
        .info-panel.active { right: 20px; }
    </style>
</head>

<body> <!-- BODY COMES AFTER CSS -->
    <div class="space">
        <div class="sun" onclick="showInfo('Sun', 'The star at the center of our Solar System.')"></div>

        <div class="orbit earth-orbit">
            <div class="planet earth" onclick="showInfo('Earth', 'Our home planet with liquid water.')"></div>
        </div>

        <div class="orbit mars-orbit">
            <div class="planet mars" onclick="showInfo('Mars', 'The Red Planet.')"></div>
        </div>
    </div>

    <div id="info-panel" class="info-panel">
        <h2 id="planet-name">Click a Planet</h2>
        <p id="planet-desc">Select a planet to explore details.</p>
        <button onclick="closePanel()">Close</button>
    </div>

    <!-- JAVASCRIPT RUNS AT THE VERY END OF BODY -->
    <script>
        function showInfo(name, description) {
            document.getElementById('planet-name').innerText = name;
            document.getElementById('planet-desc').innerText = description;
            document.getElementById('info-panel').classList.add('active');
        }
        function closePanel() {
            document.getElementById('info-panel').classList.remove('active');
        }
    </script>
</body>
</html>
